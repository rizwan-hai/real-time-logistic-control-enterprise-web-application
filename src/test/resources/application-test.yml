spring:
  datasource:
    url: jdbc:h2:mem:logistics;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
app:
  rate-limit:
    enabled: false
  minio:
    endpoint: http://localhost:9000
    access-key: test-key
    secret-key: test-secret
    bucket: test-bucket
