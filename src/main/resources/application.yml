spring:
  application:
    name: logistics-platform
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:com.example.logistics.tracking
    validate-on-migrate: true
transport:
  routing:
    provider: ${TRANSPORT_ROUTING_PROVIDER:haversine}
    osrm-base-url: ${OSRM_BASE_URL:http://localhost:5000}
    google-base-url: ${GOOGLE_DIRECTIONS_BASE_URL:https://maps.googleapis.com/maps/api}
    google-api-key: ${GOOGLE_DIRECTIONS_API_KEY:}
  data:
    redis:
      timeout: 2s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
tracking:
  alerts:
    speeding-kph: ${TRACKING_SPEEDING_KPH:120}
    idle-minutes: ${TRACKING_IDLE_MINUTES:15}
    device-offline-minutes: ${TRACKING_DEVICE_OFFLINE_MINUTES:10}
    route-deviation-km: ${TRACKING_ROUTE_DEVIATION_KM:2}
    late-delivery-risk-minutes: ${TRACKING_LATE_DELIVERY_RISK_MINUTES:15}
    sweep-interval-millis: ${TRACKING_ALERT_SWEEP_INTERVAL_MILLIS:60000}
server:
  shutdown: graceful
  forward-headers-strategy: framework
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  config: classpath:logback-spring.xml
app:
  identity:
    issuer: logistics-platform
    audience: logistics-api
    access-token-minutes: 15
    refresh-token-days: 7
    password-reset-minutes: 30
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    from-email: ${MAIL_FROM:no-reply@logistics.local}
    jwt-secret: ${APP_JWT_SECRET:local-development-only-secret-change-this-64-bytes-minimum-000000}
    dev-admin-email: ${DEV_ADMIN_EMAIL:admin@logistics.local}
    dev-admin-password: ${DEV_ADMIN_PASSWORD:LocalAdmin123!ChangeMe}
    secure-cookies: false
  rate-limit:
    enabled: true
    requests: 120
    window-seconds: 60
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:logistics-files}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/logistics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:logistics}
    password: ${DB_PASSWORD:logistics}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

---
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
app:
  identity:
    jwt-secret: ${APP_JWT_SECRET}
    dev-admin-email: ${DEV_ADMIN_EMAIL:}
    dev-admin-password: ${DEV_ADMIN_PASSWORD:}
    secure-cookies: true
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
app:
  identity:
    jwt-secret: ${APP_JWT_SECRET}
    dev-admin-email: ${DEV_ADMIN_EMAIL:}
    dev-admin-password: ${DEV_ADMIN_PASSWORD:}
    secure-cookies: true
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
