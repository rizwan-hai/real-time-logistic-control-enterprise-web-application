name: logistics-control

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-logistics}
      MYSQL_USER: ${MYSQL_USER:-logistics}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes: [mysql-data:/var/lib/mysql]
    networks: [app]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4.12-alpine3.21
    restart: unless-stopped
    command: [sh, -c, 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes: [redis-data:/data]
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    restart: unless-stopped
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: [minio-data:/data]
    networks: [app]
    healthcheck:
      test: [CMD, /usr/bin/silo, healthcheck, ready]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio-bucket-init:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    restart: "no"
    entrypoint: [mcli]
    command: [mb, --ignore-existing, local/logistics-files]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}:${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}@minio:9000
    depends_on:
      minio: {condition: service_healthy}
    networks: [app]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025"
    networks: [app]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8025/]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 9091
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-logistics}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-logistics}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: logistics-files
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@example.test}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-ChangeMe-Local-Only-123!}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
      - "127.0.0.1:${MANAGEMENT_PORT:-9091}:9091"
    networks: [app, edge, observability]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-bucket-init: {condition: service_completed_successfully}
      mailhog: {condition: service_started}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9091/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  frontend-dev:
    profiles: [dev]
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      API_SCHEMA_URL: http://backend:8080/v3/api-docs
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    networks: [edge]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend-nginx:
    profiles: [production]
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        API_SCHEMA_URL: ${API_SCHEMA_URL:-http://host.docker.internal:8080/v3/api-docs}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-80}:80"
    networks: [edge]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=15d, --web.enable-lifecycle]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [observability]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9090/-/healthy]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [observability]
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  app:
    internal: true
  edge: {}
  observability:
    internal: true

volumes:
  mysql-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
